<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Task Bidder</title>
  <script src="https://unpkg.com/htmx.org@1.9.12"></script>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <nav>
    <a href="{{ url_for('tasks.list_tasks') }}" class="brand">Task Bidder</a>
    {% if current_user.is_authenticated %}
      <a href="{{ url_for('tasks.list_tasks') }}">Tasks</a>
      <a href="{{ url_for('tasks.leaderboard') }}">Leaderboard</a>
      {% if current_user.is_admin %}
        <a href="{{ url_for('admin.list_workers') }}">Workers</a>
      {% endif %}
      <span class="spacer"></span>
      <span class="user-info">{{ current_user.display_name }} &middot; {{ current_user.role }}{% if current_user.is_admin %} &middot; admin{% endif %}</span>
      <a href="{{ url_for('auth.logout') }}">Logout</a>
    {% endif %}
  </nav>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
