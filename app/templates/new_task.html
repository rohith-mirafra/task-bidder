{% extends 'base.html' %}
{% block content %}
<h1>New Task</h1>
<form method="post" class="task-form">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <label>Title <input type="text" name="title" required></label>
  <label>Description <textarea name="description" rows="4"></textarea></label>
  <label>Points <input type="number" name="points" value="1" min="1" required></label>
  <label>Priority
    <select name="priority">
      <option value="low">Low</option>
      <option value="medium" selected>Medium</option>
      <option value="high">High</option>
    </select>
  </label>
  <label>Deadline <input type="date" name="deadline"></label>
  <label>Required skills (comma-separated, leave blank to open to every worker)
    <input type="text" name="required_skills" placeholder="e.g. python, aws, react">
  </label>
  <button type="submit">Create Task</button>
</form>
{% endblock %}
